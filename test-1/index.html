<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.1/lottie.min.js"></script>
    <style>
        #lottie-container-1,
        #lottie-container-2,
        #lottie-container-3 {
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="lottie-container-1"></div>
    <div id="lottie-container-2"></div>
    <div id="lottie-container-3"></div>
    <script>
        lottie.loadAnimation({
            container: document.getElementById('lottie-container-1'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '1.json'
        });
        lottie.loadAnimation({
            container: document.getElementById('lottie-container-2'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '2.json'
        });
        lottie.loadAnimation({
            container: document.getElementById('lottie-container-3'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '3.json'
        });
    </script>
</body>
</html>
