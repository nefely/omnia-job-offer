        <style>
            .wrap {
                width: 600px;
                max-width: calc(100vw - 30px) !important;
                margin: 15px auto;
            }
            .mySwiper {
                width: 100%;
                position: relative;
                overflow: hidden;
                backface-visibility: hidden;
                transform: translateZ(0);
                will-change: transform;
            }
            .mySwiper:not(.swiper-initialized) .swiper-wrapper {
                visibility: hidden;
            }
            .swiper-wrapper {
                align-items: center;
            }
            .swiper-slide {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none; 
                -webkit-user-drag: none;
            }
            .swiper-slide img {
                width: 100%;
                height: 100%;
                aspect-ratio: 4/5;
                object-fit: cover;
                background: #111;
                pointer-events: none; 
                -webkit-user-drag: none;
            }
            .swiper-slide-shadow-left,
            .swiper-slide-shadow-right {
                display: none !important;
            }

            @media screen and (max-width: 767px) {
                .swiper {
                    width: calc(100% + 30px);
                    transform: translateX(-15px);
                }

<body>

<div class="intro">
    <div class="wrapper">
        <div class="wrap">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <script>
                        document.addEventListener("DOMContentLoaded", () => {
                            const wrapper = document.querySelector(".mySwiper .swiper-wrapper");
                            const TOTAL_SLIDES = 11;

                            const ids = Array.from({ length: TOTAL_SLIDES }, (_, i) => i + 1);

                            for (let i = ids.length - 1; i > 0; i--) {
                                const j = Math.floor(Math.random() * (i + 1));
                                [ids[i], ids[j]] = [ids[j], ids[i]];
                            }

                            let array = {
                                1: { name: "Alba", distance: "2.1 km" },
                                2: { name: "Louise", distance: "1.3 km" },
                                3: { name: "Jade", distance: "3 km" },
                                4: { name: "Ambre", distance: "4.2 km" },
                                5: { name: "Emma", distance: "1 km" },
                                6: { name: "Amelie", distance: "6 km" },
                                7: { name: "Camille", distance: "2 km" },
                                8: { name: "Chloé", distance: "7.3 km" },
                                9: { name: "Clara", distance: "3 km" },
                                10: { name: "Juliette", distance: "5 km" },
                                11: { name: "Sarah", distance: "4 km" },
                            };

                            const makeSlideHTML = (n) => `
                            <div class="swiper-slide">
                                <img data-src="${basePath}${n}.webp" src="" alt="">
                                <a href="https://track.cloackandtrackit.com/click" class="slide-link btn btn-secondary">
                                    Discuter maintenant
                                </a>
                                <p class="slide-caption">
                                    <span class="text-bigger">
                                        <span class="slide-caption-name">${array[n].name}</span>
                                        en ligne<span class="slide-caption-online"></span>
                                    </span>
                                    <br/>
                                    <span class="slide-caption-distance">${array[n].distance}</span> de vous
                                </p>
                            </div>`;

                            wrapper.innerHTML = ids.map(makeSlideHTML).join("");

                            const slidesCount = wrapper.children.length;
                            const middle = Math.floor(slidesCount / 2);

                            const swiper = new Swiper(".mySwiper", {
                                loop: true,
                                loopAdditionalSlides: 3,
                                effect: "coverflow",
                                centeredSlides: true,
                                centeredSlidesBounds: true,
                                grabCursor: true,
                                simulateTouch: true,
                                allowTouchMove: true,
                                watchSlidesProgress: true,
                                initialSlide: middle,
                                autoplay: { delay: 10000, disableOnInteraction: false },
                                speed: 600,
                                coverflowEffect: {
                                    rotate: 30,
                                    stretch: 0,
                                    depth: 120,
                                    modifier: 1,
                                    slideShadows: false,
                                },
                                breakpoints: {
                                    0: { 
                                        slidesPerView: 1.35, 
                                        spaceBetween: 6 
                                    },
                                    768: { 
                                        slidesPerView: 2.0, 
                                        spaceBetween: 12 
                                    },
                                },
                            });

                            function revealImg(img) {
                                const src = img.getAttribute("data-src");
                                if (!src) return;
                                img.src = src;
                                img.removeAttribute("data-src");
                            }
                            function lazyLoadAround(index, radius) {
                                const slides = swiper.slides;
                                const total = slides.length;
                                const idxs = new Set([index]);
                                for (let r = 1; r <= radius; r++) {
                                    idxs.add((index + r) % total);
                                    idxs.add((index - r + total) % total);
                                }
                                idxs.forEach((i) => {
                                    const img = slides[i].querySelector("img[data-src]");
                                    if (img) revealImg(img);
                                });
                            }

                            lazyLoadAround(swiper.activeIndex, 2);

                            if ("IntersectionObserver" in window) {
                                const io = new IntersectionObserver(
                                    (entries) => {
                                        entries.forEach((e) => {
                                            if (e.isIntersecting) {
                                                revealImg(e.target);
                                                io.unobserve(e.target);
                                            }
                                        });
                                    },
                                    { root: document.querySelector(".mySwiper"), threshold: 0.1 }
                                );
                                document.querySelectorAll(".mySwiper img[data-src]").forEach((img) => io.observe(img));
                            }

                            swiper.on("slideChange", () => {
                                lazyLoadAround(swiper.activeIndex, 2);
                            });
                        });
                    </script>
