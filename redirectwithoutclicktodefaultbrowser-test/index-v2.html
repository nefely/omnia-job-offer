<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    



<script>
(function() {
    var parser = new UAParser();
    var result = parser.getResult();
    var device = result.device;
    var browser = result.browser;
    var os = result.os;
    var ua = result.ua;
    var WEB_VIEW_UA = '; wv';

    function isIntent() {
        return (
            ['mobile', 'tablet'].indexOf(device.type) !== -1 &&
            ((os.name === 'Android' && ua.indexOf(WEB_VIEW_UA) !== -1) ||
                (os.name === 'iOS' &&
                    ['Instagram', 'Facebook'].indexOf(browser.name) !== -1))
        );
    }

    function handleIntentRedirect(link) {
        var url = new URL(link);
        var cleanURL = url.hostname + url.pathname + url.search;
        if (os.name === 'Android') {
            window.location.href = 'intent://' + cleanURL + '#Intent;package=com.android.chrome;scheme=https;end';
        } else if (os.name === 'iOS') {
            window.location.href = atob('eC1zYWZhcmktaHR0cHM6Ly8=') + cleanURL;
        } else {
            window.open('https://' + cleanURL);
        }
    }

    //document.addEventListener('DOMContentLoaded', function () {
        var links = document.querySelectorAll('a.btn');
        for (var i = 0; i < links.length; i++) {
            (function(link) {
                link.addEventListener('click', function(event) {
                    if (isIntent()) {
                        event.preventDefault();
                        handleIntentRedirect(link.href);
                    }
                });
            })(links[i]);
        }
    //});
})();
</script>

</body>
</html>
