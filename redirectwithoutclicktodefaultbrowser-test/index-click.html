<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="jquery-3.6.4.min.js"></script>
</head>
<body>


    <button id="offer_link">click</button>

<script>
    $(document).ready(function () {
        function getQueryString() {
            return window.location.search || "";
        }

        function buildTargetUrl() {
            var queryString = getQueryString();
            return "https://rewardsplace.net/sh-snap" + queryString;
        }

        function openInExternalBrowser(url) {
            var ua = navigator.userAgent.toLowerCase();

            var isIOS = /iphone|ipad|ipod/.test(ua);
            var isAndroid = /android/.test(ua);
            var isCriOS = /crios/.test(ua);
            var isFxiOS = /fxios/.test(ua);
            var isSafari = /safari/.test(ua) && !isCriOS && !isFxiOS;
            var isWebView = isIOS && !isSafari && !isCriOS && !isFxiOS;

            if (isIOS && isWebView) {
                return "x-safari-" + url;
            } else if (isAndroid) {
                return "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;end";
            } else {
                return url; 
            }
        }

        var finalUrl = buildTargetUrl();
        var mobileSchemeUrl = openInExternalBrowser(finalUrl);
        
        $("#offer_link").click(function(e){
            window.location.href = mobileSchemeUrl;

            setTimeout(function () {
                window.location.href = finalUrl;
            }, 300);
        })
    });
</script>
</body>
</html>
