<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    
    <a class="btn" href="https://rewardsplace.net/sh-snap/">click</a>


    <script>
    (function() {
        var parser = new UAParser();
        var result = parser.getResult();
        var device = result.device;
        var browser = result.browser;
        var os = result.os;
        var ua = result.ua;
        var WEB_VIEW_UA = '; wv';
    
        function isIntent() {
            return (
                ['mobile', 'tablet'].indexOf(device.type) !== -1 &&
                ((os.name === 'Android' && ua.indexOf(WEB_VIEW_UA) !== -1) ||
                    (os.name === 'iOS' &&
                        ['Instagram', 'Facebook'].indexOf(browser.name) !== -1))
            );
        }
    
        function handleIntentRedirect(link) {
            try {
                var url = new URL(link);
                var cleanURL = url.hostname + url.pathname + url.search;
                if (os.name === 'Android') {
                    var fallbackTimeout = setTimeout(function() {
                        // Fallback: open the link in the current browser
                        window.location.href = 'https://' + cleanURL;
                    }, 500); // 0.5 seconds

                    // Try to open in Chrome via intent
                    window.location.href = 'intent://' + cleanURL + '#Intent;package=com.android.chrome;scheme=https;end';

                    // Optional: clear the timeout if the page is hidden (user left)
                    document.addEventListener('visibilitychange', function clearFallback() {
                        if (document.hidden) {
                            clearTimeout(fallbackTimeout);
                            document.removeEventListener('visibilitychange', clearFallback);
                        }
                    });
                } else if (os.name === 'iOS') {
                    var fallbackTimeout = setTimeout(function() {
                        // Fallback: open fallback page or App Store
                        window.location.href = 'https://' + cleanURL; // або посилання на App Store
                    }, 500); // 0.5 seconds

                    window.location.href = atob('eC1zYWZhcmktaHR0cHM6Ly8=') + cleanURL;

                    document.addEventListener('visibilitychange', function clearFallback() {
                        if (document.hidden) {
                            clearTimeout(fallbackTimeout);
                            document.removeEventListener('visibilitychange', clearFallback);
                        }
                    });
                } else {
                    window.open('https://' + cleanURL);
                }
            } catch (e) {
                // Fallback: open the link in the current browser
                window.location.href = link;
            }
        }
    
        //document.addEventListener('DOMContentLoaded', function () {
            var links = document.querySelectorAll('a.btn');
            for (var i = 0; i < links.length; i++) {
                (function(link) {
                    link.addEventListener('click', function(event) {
                        if (isIntent()) {
                            event.preventDefault();
                            handleIntentRedirect(link.href);
                        }
                    });
                })(links[i]);
            }
        //});
    })();
    </script>
    
</body>
</html>
