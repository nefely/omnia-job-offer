<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Contact Us</title>
    <link rel="shortcut icon" type="image/png" href="../media/fav.png"/>
    <meta name="theme-color" content="#2D2B2B"/>
</head>
<body>
    <main>
        <div class="wrapper">
            <div class="main_link">
                <a href="../"><h4>Home Page</h4></a>
            </div>
            <div class="title">
                <h2>Contact Us</h2>
            </div>
            <div class="container">
                <p>Have questions, feedback, or just want to say hi? We’d love to hear from you! Reach out to us through any of the following channels:</p>
                <strong>Email:</strong>
                <a href="" class="mailto"></a> <br>
                <a href="" class="support"></a>
            </div>
        </div> 
    </main>

    <link rel="stylesheet" href="../css/global.css">

    <style>
        main{
            margin: 40px 0;
            display: block !important;
        }
        main .wrapper {
            display: block;
            max-width: 700px;
            width: calc(100% - 40px);
            margin: 0 auto;
            line-height: 1.4em;
            font-size: 16px;
        }
        .main_link {
            text-align: center;
        }
        .main_link a {
            color: var(--info-color-dark);
        }
        .title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            display: block;
            width: 100%;
            margin-top: 40px;
        }
        .container > *:not(:last-child) {
            margin-bottom: 10px;
        }
        .container > strong {
            margin-top: 20px;
            display: block;
            margin-bottom: 0px !important;
        }
    </style>

    <script src="../js/jquery-3.6.4.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
