    <main class="screen">
        <div class="container container-whitebox">
            <div class="row">
                <div class="col-12 col-lg-6 col-content mob">
                    <div class="title">
                        <h2 data-text="head_title"></h2>
                        <p data-text="under_head_title"></p>

                        <h3 class="name" data-text="name"></h3>

                        </p>
                    </div>
                    <div class="buttons-container">
                        <button class="btn btn-no btn-round">
                            <img src="img/material-symbols_close-rounded.svg" alt="">

                        <a class="btn btn-primary a-link" href="https://track.loveme.today/click">
                            <img src="img/chat.svg" alt="">

                        </a>
                        <button class="btn btn-yes btn-round">
                            <img src="img/line-md_heart.svg" alt="">
                        </button>
                    </div>

                                <h2 data-text="head_title"></h2>
                                <p data-text="under_head_final_title"></p>
                            </div>
                            <div class="img mob">

                            </div>
                            <div class="title">
                                <h2 data-text="title_final"></h2>
                                <p class="muted" data-text="under_title_final"></p>
                            </div>
                            <p class="mob" data-text="final_up_button_text"></p>
                            <div class="buttons-container">
                                <a class="btn btn-primary a-link" href="https://track.loveme.today/click">
                                    <img src="img/chat.svg" alt="">
                                    <span>Start Chatting Now</span>
                                </a>
                            </div>
                            <p class="mob" data-text="final_under_button_text"></p>
