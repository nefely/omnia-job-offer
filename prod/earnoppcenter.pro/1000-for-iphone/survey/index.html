<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>EarnOppCenter</title>

    <link rel="icon" href="../img/fav.png">

    <script type="text/javascript">
		let vh = window.innerHeight * 0.01;
		document.documentElement.style.setProperty('--vh', `${vh}px`);
	</script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/jquery-3.6.4.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/survey.js"></script>

    <script type="text/javascript">
        window.getURLParameter = (sUrl, sParam) => {
            let sPageURL = decodeURI(sUrl.substring(sUrl.indexOf('?') + 1));
            let sURLVariables = sPageURL.split('&');
            for (let i = 0; i < sURLVariables.length; i++) {
                let sParameterName = sURLVariables[i].split('=');
                if (sParameterName[0] == sParam) {
                    return sParameterName[1];
                }
            }
        }
    </script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '617574380860973', {
        em: `${window.getURLParameter(window.location.href, 'sub15')}`,
        fn: `${window.getURLParameter(window.location.href, 'sub13')}`,
        ln: `${window.getURLParameter(window.location.href, 'sub14')}`,
        pg: `1${window.getURLParameter(window.location.href, 'sub16')}`
    }); 
    </script>
    
</head>
<body style="background-color: black;">
    
    <div class="screen">

        <header style="opacity: 0;">
            <div class="container">
                <div class="row">
                    <div class="logo">
                        <img src="../img/logo.svg" alt="logo">
                    </div>
                </div>
            </div>
        </header>

        <section class="hero">
            <div class="container">
                <div class="row">
                    <div class="inner">

                        <div class="progress" style="opacity: 0;">
                            <div class="row">
                                <div class="progress-container">
                                    <div class="progress-inner">
                                        <div class="circle-container active"><p class="circle"><span>1</span></p></div>
                                        <div class="line-container">
                                            <div class="line"></div>
                                            <div class="line-green"></div>
                                        </div>
                                        <div class="circle-container"><p class="circle"><span>2</span></p></div>
                                        <div class="line-container">
                                            <div class="line"></div>
                                            <div class="line-green"></div>
                                        </div>
                                        <div class="circle-container"><p class="circle"><span>3</span></p></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="welcome">
                            <div class="row">
                                <div class="welcome-container">
                                    <div class="welcome-img">
                                        <img src="../img/welcome.png" alt="welcome">
                                    </div>
                                    <div class="welcome-content">
                                        <h1>Welcome!</h1>
                                        <p>Start with a short survey to receive <br> the best earning opportunity.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="analizer">
                            <div class="row">
                                <div class="analizer-container">
                                    <p class="tezis">We analyze your responses</p>
                                </div>

                                <div class="analizer-carrousel">
                                    <div class="analizer-carrousel-container">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                        <img src="../img/carrousel-img.png" alt="">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="quiz">
                            <div class="row">
                                <div class="quiz-container">
                                    <div class="quiz-block quiz-block-1">
                                        <div class="title">
                                            <h6>Have you ever owned <br> an Apple device?</h6>
                                        </div>
                                        <div class="answers">
                                            <button class="btn btn-primary">Yes, I own one now</button>
                                            <button class="btn btn-primary">Yes, but not currently</button>
                                            <button class="btn btn-primary">No, never</button>
                                        </div>
                                    </div>

                                    <div class="quiz-block quiz-block-2">
                                        <div class="title">
                                            <h6>How much time do you spend <br> on your phone each day?</h6>
                                        </div>
                                        <div class="answers">
                                            <button class="btn btn-primary">Under 2 hours</button>
                                            <button class="btn btn-primary">2 to 5 hours </button>
                                            <button class="btn btn-primary">Over 5 hours</button>
                                        </div>
                                        <div class="back">
                                            <button>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="14" viewBox="0 0 19 14" fill="none">
                                                    <path d="M18.6428 7L2.35711 7M2.35711 7L8.25366 13M2.35711 7L8.25366 0.999999" stroke="#999" stroke-opacity="0.4" stroke-width="2"></path>
                                                </svg>
                                                <p>Back</p>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="quiz-block quiz-block-3">
                                        <div class="title">
                                            <h6>Which phone brand <br> do you currently use?</h6>
                                        </div>
                                        <div class="answers">
                                            <button class="btn btn-primary">iPhone</button>
                                            <button class="btn btn-primary">Google</button>
                                            <button class="btn btn-primary">Samsung</button>
                                            <button class="btn btn-primary">Other</button>
                                        </div>
                                        <div class="back">
                                            <button>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="14" viewBox="0 0 19 14" fill="none">
                                                    <path d="M18.6428 7L2.35711 7M2.35711 7L8.25366 13M2.35711 7L8.25366 0.999999" stroke="#999" stroke-opacity="0.4" stroke-width="2"></path>
                                                </svg>
                                                <p>Back</p>
                                            </button>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
